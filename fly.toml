# fly.toml app configuration file generated for toms-fuel-finder on 2026-06-26T11:51:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'toms-fuel-finder'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
