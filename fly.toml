# fly.toml app configuration file generated for toms-fuel-finder on 2026-06-30T09:38:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'toms-fuel-finder'
primary_region = 'lhr'

[build]
  build-target = 'runtime'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "40s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/readyz"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['app']
  size = 'shared-cpu-1x'
